<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="Akash mainnet akashnet-2">
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="2.6" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
  <clipPath id="lane"><rect x="30" y="140" width="540" height="42"/></clipPath>
  <linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#0a1020"/><stop offset=".12" stop-color="#0a1020" stop-opacity="0"/><stop offset=".88" stop-color="#0a1020" stop-opacity="0"/><stop offset="1" stop-color="#0a1020"/></linearGradient>
</defs>
<style>
  .chain{animation:move 3s linear infinite}
  @keyframes move{to{transform:translateX(-40px)}}
  .go{animation:go 1.5s ease-in-out infinite}
  @keyframes go{50%{transform:translateX(5px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="599" height="199" rx="20" fill="#0a1020" stroke="#ff6b6b" stroke-opacity=".3"/>
<image href="data:image/svg+xml;base64," x="32" y="26" width="26" height="26"/>
<text x="68" y="45" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" letter-spacing="3" fill="#ff6b6b">AKASH &#183; MAINNET</text>
<text x="31" y="98" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="800" letter-spacing="-1" fill="#eef3fa">akashnet-2</text>
<text x="33" y="124" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="12" fill="#9aa7bd" letter-spacing="1">akash v2.1.0 &#183; cosmos-sdk v0.53</text>
<g>
