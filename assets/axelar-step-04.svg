<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-label="Axelar step 04">
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="2.6" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
  <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#0e1424"/><stop offset=".5" stop-color="#070a16"/><stop offset="1" stop-color="#04060d"/></linearGradient>
  <linearGradient id="num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6ebf5"/><stop offset="1" stop-color="#7fdcff"/></linearGradient>
</defs>
<style>
  .rise{opacity:0;animation:rise .9s ease-out forwards}
  @keyframes rise{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<rect width="1200" height="140" rx="20" fill="url(#bg)"/>
<rect x=".5" y=".5" width="1199" height="139" rx="20" fill="none" stroke="#e6ebf5" stroke-opacity=".18"/>
<text x="40" y="100" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="76" font-weight="800" fill="url(#num)" letter-spacing="-3">04</text>
<g class="rise">
  <text x="160" y="62" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="700" letter-spacing="4" fill="#e6ebf5">AXELAR &#183; STEP 04 / 06</text>
  <text x="158" y="98" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="800" fill="#eef3fa" letter-spacing="-.5">External chains</text>
  <text x="160" y="122" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#9aa7bd">EVM RPCs and chain maintainers</text>
</g>
<line x1="790" y1="70" x2="1120" y2="70" stroke="#eef3fa" stroke-opacity=".12" stroke-width="2"/>
<line x1="790" y1="70" x2="988" y2="70" stroke="#e6ebf5" stroke-opacity=".7" stroke-width="2"/>
  <circle cx="790" cy="70" r="6" fill="#e6ebf5" fill-opacity=".55" stroke="#e6ebf5" stroke-width="1.5"/>
  <text x="790" y="104" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="10" fill="#5d6b82">01</text>
  <circle cx="856" cy="70" r="6" fill="#e6ebf5" fill-opacity=".55" stroke="#e6ebf5" stroke-width="1.5"/>
  <text x="856" y="104" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="10" fill="#5d6b82">02</text>
  <circle cx="922" cy="70" r="6" fill="#e6ebf5" fill-opacity=".55" stroke="#e6ebf5" stroke-width="1.5"/>
  <text x="922" y="104" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="10" fill="#5d6b82">03</text>
  <circle cx="988" cy="70" r="9" fill="none" stroke="#7fdcff" stroke-width="1.5"><animate attributeName="r" values="9;22" dur="1.8s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".9;0" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="988" cy="70" r="9" fill="#7fdcff" filter="url(#glow)"/>
  <text x="988" y="104" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="10" fill="#7fdcff">04</text>
  <circle cx="1054" cy="70" r="6" fill="#0f1830" stroke="#eef3fa" stroke-opacity=".25"/>
  <text x="1054" y="104" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="10" fill="#5d6b82">05</text>
  <circle cx="1120" cy="70" r="6" fill="#0f1830" stroke="#eef3fa" stroke-opacity=".25"/>
  <text x="1120" y="104" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="10" fill="#5d6b82">06</text>

  <circle r="3" fill="#ffffff" filter="url(#glow)"><animateMotion dur="1.55s" repeatCount="indefinite" path="M790 70 H988"/></circle>
</svg>