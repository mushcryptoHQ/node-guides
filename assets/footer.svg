<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="MushCrypto — Infrastructure, unseen.">
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c675"/>
      <stop offset="1" stop-color="#b57a1d"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#00b6fd" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00b6fd" stop-opacity=".6"/>
      <stop offset="1" stop-color="#00b6fd" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .r{fill:none;stroke:url(#fade);stroke-width:1.2;stroke-dasharray:1000;stroke-dashoffset:1000;animation:d 8s ease-in-out infinite}
    @keyframes d{0%{stroke-dashoffset:1000}40%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    .m{transform-box:fill-box;transform-origin:50% 100%;animation:bob 4s ease-in-out infinite}
    @keyframes bob{50%{transform:scale(1.06,.96)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important}}
  </style>
  <rect width="1200" height="150" rx="22" fill="#05080f"/>
  <path d="M0 52 H1200" stroke="#eef3fa" stroke-opacity=".1"/>
  <path class="r" pathLength="1000" d="M600 52 C 520 70, 420 64, 300 90 S 80 110, 0 104"/>
  <path class="r" pathLength="1000" d="M600 52 C 680 70, 780 64, 900 90 S 1120 110, 1200 104" style="animation-delay:.3s"/>
  <path class="r" pathLength="1000" d="M600 52 C 560 90, 470 110, 380 132" style="animation-delay:.8s"/>
  <path class="r" pathLength="1000" d="M600 52 C 640 90, 730 110, 820 132" style="animation-delay:1.1s"/>
  <g transform="translate(600 52)"><g class="m">
    <path d="M-3 0 L-2.4 -14 L2.4 -14 L3 0 Z" fill="#d9cfbf"/>
    <path d="M-14 -12 Q -14 -29 0 -31 Q 14 -29 14 -12 Q 0 -16 -14 -12 Z" fill="url(#cap)"/>
    <circle cx="-4" cy="-22" r="1.6" fill="#7fdcff"/>
  </g></g>
  <text x="600" y="128" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="3" fill="#5d6b82">INFRASTRUCTURE, UNSEEN.</text>
</svg>
